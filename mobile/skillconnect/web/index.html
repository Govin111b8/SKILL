<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkillConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SkillConnect — Find Skilled Professionals</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    #phone-frame { width: 100%; height: 100%; }
    #flutter-app { width: 100%; height: 100%; }
    @media (min-width: 520px) {
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; overflow: auto; padding: 24px 0;
        background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 70%);
      }
      #phone-frame {
        width: 393px; height: 852px;
        border-radius: 54px; overflow: hidden; position: relative;
        background: #000; flex-shrink: 0;
        box-shadow: 0 0 0 2px #1e293b, 0 0 0 5px #0f172a,
                    0 40px 120px rgba(0,0,0,0.75),
                    inset 0 0 0 1px rgba(255,255,255,0.06);
      }
      #phone-frame::before {
        content: ''; position: absolute; top: 13px; left: 50%;
        transform: translateX(-50%); width: 120px; height: 34px;
        background: #000; border-radius: 20px; z-index: 9999; pointer-events: none;
      }
      #flutter-app { width: 100%; height: 100%; overflow: hidden; }
    }
  </style>
</head>
<body>
  <div id="phone-frame">
    <div id="flutter-app"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
