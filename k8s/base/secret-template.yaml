---
# ──────────────────────────────────────────────────────────────────────────────
# Secret template — DO NOT commit actual values.
# Create with:
#   kubectl create secret generic skillconnect-secrets \
#     --from-env-file=.env.production \
#     -n skillconnect
#
# Or use External Secrets Operator + AWS Secrets Manager:
#   kubectl apply -f k8s/base/external-secret.yaml
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: skillconnect-secrets
  namespace: skillconnect
  annotations:
    # Managed by External Secrets Operator — do not edit manually
    externalsecrets.io/managed: "true"
type: Opaque
# Values are base64-encoded. Replace placeholders before applying.
# Generate: echo -n 'value' | base64
stringData:
  DB_PASSWORD: "REPLACE_ME"
  DB_USER: "skillconnect_app"
  JWT_SECRET: "REPLACE_ME_min_32_chars"
  JWT_REFRESH_SECRET: "REPLACE_ME_min_32_chars"
  ENCRYPTION_KEY: "REPLACE_ME_64_hex_chars"
  REDIS_PASSWORD: "REPLACE_ME"
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"
  SENDGRID_API_KEY: "REPLACE_ME"
  MSG91_AUTH_KEY: "REPLACE_ME"
  MSG91_SENDER_ID: "SKILLC"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_REGION: "ap-south-1"
  S3_BUCKET: "skillconnect-uploads-prod"
  FCM_SERVER_KEY: "REPLACE_ME"
  HYPERVERGE_APP_ID: "REPLACE_ME"
  HYPERVERGE_APP_KEY: "REPLACE_ME"
  SENTRY_DSN: "REPLACE_ME"
