apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skillconnect-secrets
  namespace: skillconnect
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: skillconnect-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: skillconnect/database
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: skillconnect/auth
        property: jwt_secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: skillconnect/redis
        property: password
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: skillconnect/payments
        property: razorpay_key_id
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: skillconnect/payments
        property: razorpay_key_secret
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: skillconnect/search
        property: meili_master_key
