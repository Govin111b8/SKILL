---
# ──────────────────────────────────────────────────────────────────────────────
# SkillConnect Backend — Deployment + PgBouncer sidecar
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: skillconnect
  labels:
    app: backend
    app.kubernetes.io/part-of: skillconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Blue/green style — zero downtime
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: skillconnect-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      # ── Init container: wait for postgres-service before starting ──────────
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL at postgres-service:5432…"; sleep 2;
              done
      containers:
        # ── Main application ─────────────────────────────────────────────────
        - name: backend
          image: ghcr.io/govin111b8/skillconnect/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: skillconnect-config
            - secretRef:
                name: skillconnect-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

        # ── PgBouncer sidecar ────────────────────────────────────────────────
        # Routes backend → PgBouncer → PostgreSQL for connection pooling
        - name: pgbouncer
          image: bitnami/pgbouncer:1.22.1
          env:
            - name: POSTGRESQL_HOST
              value: postgres-service
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skillconnect-secrets
                  key: DB_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillconnect-secrets
                  key: DB_PASSWORD
            - name: POSTGRESQL_DATABASE
              value: skillconnect
            - name: PGBOUNCER_PORT
              value: "5432"
            - name: PGBOUNCER_POOL_MODE
              value: "transaction"
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "500"
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "20"
            - name: PGBOUNCER_MIN_POOL_SIZE
              value: "5"
          ports:
            - name: pgbouncer
              containerPort: 5432
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: skillconnect
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP

---
# Service Account for backend (can be annotated for IRSA / Workload Identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skillconnect-backend
  namespace: skillconnect
  annotations:
    # AWS IRSA: uncomment and replace ARN
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/skillconnect-backend

---
# PersistentVolumeClaim for local uploads (use S3 in production)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: skillconnect
spec:
  accessModes:
    - ReadWriteMany          # Requires NFS / EFS CSI driver in multi-replica setup
  resources:
    requests:
      storage: 20Gi
  storageClassName: efs-sc   # Replace with your storage class
