# ──────────────────────────────────────────────────────────────────────────────
# nginx — Production HTTPS config with Let's Encrypt
#
# Deploy steps:
#   1. Install certbot + nginx plugin:
#      sudo apt install certbot python3-certbot-nginx
#
#   2. Obtain initial certificate (HTTP-01 challenge):
#      sudo certbot --nginx -d skillconnect.in -d www.skillconnect.in \
#        --email devops@skillconnect.in --agree-tos --non-interactive
#
#   3. Copy this file to /etc/nginx/conf.d/skillconnect.conf
#      (certbot will update the ssl_certificate lines automatically)
#
#   4. Test + reload:
#      sudo nginx -t && sudo nginx -s reload
#
#   5. certbot auto-renews via /etc/cron.d/certbot (pre-installed on Ubuntu)
# ──────────────────────────────────────────────────────────────────────────────

# ── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name skillconnect.in www.skillconnect.in;

    # Let's Encrypt ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Deep link verification files (Android App Links + iOS Universal Links)
    location /.well-known/ {
        alias /etc/nginx/well-known/;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Main Site ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillconnect.in www.skillconnect.in;

    # ── TLS — managed by certbot ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/skillconnect.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillconnect.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' wss://skillconnect.in https://api.skillconnect.in https://*.amazonaws.com;
      frame-src https://checkout.razorpay.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Cache fingerprinted static assets forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sitemap.xml {
        expires 1d;
        try_files $uri @api;
    }

    location = /robots.txt {
        expires 7d;
        try_files $uri =200;
    }

    # Deep link verification files (Android App Links + iOS Universal Links)
    location /.well-known/ {
        alias /etc/nginx/well-known/;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @api {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Block /metrics from public access
    location = /metrics {
        deny all;
    }
}

# ── HTTPS — Grafana subdomain ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.skillconnect.in;

    ssl_certificate     /etc/letsencrypt/live/skillconnect.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillconnect.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Restrict to VPN/office IP — REPLACE with actual IPs
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
