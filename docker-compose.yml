# ──────────────────────────────────────────────────────────────
# SkillConnect — Docker Compose for local development
# ──────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: skillconnect
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: local-dev-secret-change-in-production-32chars!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: info
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Cron jobs
      ENABLE_CRON: "true"
      # Storage
      STORAGE_PROVIDER: local
      # SMS Provider (set to 'msg91' or 'twilio' with credentials in production)
      SMS_PROVIDER: none
      # Face match (set to 'hyperverge' or 'rekognition' in production)
      FACE_MATCH_PROVIDER: mock
      FACE_MATCH_MOCK_SCORE: "92"
      # KYC auto-verification (disable in production, use manual admin review)
      KYC_AUTO_VERIFY: "false"
      # Encryption key for PII (generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
      # ENCRYPTION_KEY: <64-char-hex-string>
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:
