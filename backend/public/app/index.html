<!DOCTYPE html>
<html>
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillConnect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
    #phone-frame { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; border: 8px solid #333; box-shadow: 0 25px 80px rgba(0,0,0,0.6), inset 0 0 4px rgba(255,255,255,0.05); position: relative; background: #000; }
    #flutter-app { width: 100%; height: 100%; }
    @media (max-width: 500px) {
      body { background: none; }
      #phone-frame { width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="phone-frame">
    <div id="flutter-app"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
