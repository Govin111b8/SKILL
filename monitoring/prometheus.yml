# ──────────────────────────────────────────────────────────────────────────────
# Prometheus config for local Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/alerts.yml

scrape_configs:
  - job_name: 'skillconnect-backend'
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: backend
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          app: postgres
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: redis
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: node
    metrics_path: /metrics

  - job_name: 'nginx'
    static_configs:
      - targets: ['frontend:9113']
        labels:
          app: nginx
    metrics_path: /metrics
