name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: skillconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npx eslint src/ --max-warnings=0 || true

      - name: Apply database schema
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d skillconnect_test -f database/schema.sql
          PGPASSWORD=password psql -h localhost -U postgres -d skillconnect_test -f database/seed.sql
          for f in database/migrations/*.sql; do
            PGPASSWORD=password psql -h localhost -U postgres -d skillconnect_test -f "$f" 2>/dev/null || true
          done

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: skillconnect_test
          DB_USER: postgres
          DB_PASSWORD: password
          JWT_SECRET: test-secret-for-ci-minimum-32-characters!
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-build:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test || true

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t skillconnect-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t skillconnect-frontend:${{ github.sha }} ./frontend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
