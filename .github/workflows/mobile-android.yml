name: Mobile — Android Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/skillconnect/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/skillconnect/**'

jobs:
  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/skillconnect
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run unit & widget tests
        run: flutter test --coverage
        continue-on-error: true

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: mobile/skillconnect
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Build APK (debug — for PR validation)
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --flavor full --debug --dart-define=APP_ENV=staging

      - name: Build APK (release — full flavor)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --flavor full --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Build App Bundle (AAB — for Play Store)
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --flavor full --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Build Lite APK
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --flavor lite --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillconnect-apk-${{ github.sha }}
          path: |
            mobile/skillconnect/build/app/outputs/flutter-apk/
            mobile/skillconnect/build/app/outputs/bundle/
          retention-days: 30

